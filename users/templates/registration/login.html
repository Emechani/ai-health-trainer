{% extends 'registration/auth_base.html' %}
{% block title %}로그인 · Health Overview{% endblock %}
{% block content %}<h1 id="auth-title">다시 만나 반가워요</h1><p class="subtitle">로그인하고 오늘의 건강 기록을 이어가세요.</p>
<form method="post">{% csrf_token %}{% include 'registration/auth_fields.html' %}
<input type="hidden" name="next" value="{{ next }}"><button class="primary" type="submit">로그인</button></form>
<div class="account-links"><a href="{% url 'find_username' %}">아이디 찾기</a><a href="{% url 'password_reset' %}">비밀번호 재설정</a></div>
<p class="account-footer">아직 계정이 없으신가요? <a href="{% url 'signup' %}">회원가입</a></p>{% endblock %}
