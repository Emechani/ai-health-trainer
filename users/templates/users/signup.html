<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
    {% include 'includes/standalone_navigation.html' %}
    <h2>다이어트 AI 시스템 회원가입</h2>
    <p>새로운 계정을 만들어 목표 체중 달성을 시작해 보세요!</p>
    <p>입력한 현재 체중은 시작 체중으로 저장됩니다. 나중에 프로필 설정에서 수정할 수 있어요. 체중 입력은 선택 사항입니다.</p>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">가입하기</button>
    </form>
    
    <div style="margin-top: 20px;">
        <p>이미 계정이 있으신가요? <a href="/accounts/login/">로그인하러 가기</a></p>
    </div>
</body>
</html>
