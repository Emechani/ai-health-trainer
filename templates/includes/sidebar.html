{% load static %}
<style>
    /* 모바일에서는 모든 기록 화면에 동일한 상단 메뉴와 문서 스크롤을 적용합니다. */
    @media (max-width: 760px) {
        body { box-sizing: border-box; display: block; padding: 12px !important; min-height: 100vh; }
        .app-container {
            box-sizing: border-box; display: flex; flex-direction: column;
            width: 100%; max-width: 100%; height: auto; max-height: none;
            min-height: calc(100vh - 24px); margin: 0;
            border-radius: 22px; overflow: visible;
        }
        .sidebar {
            box-sizing: border-box; position: static; order: 0;
            display: flex; flex: 0 0 auto; flex-direction: row; flex-wrap: wrap;
            align-items: center; justify-content: flex-start;
            width: 100%; min-width: 0; height: auto; min-height: 0; max-height: none;
            padding: 12px 16px; gap: 10px; border-radius: 22px 22px 0 0;
            overflow: visible !important;
        }
        .sidebar .logo, .sidebar a, .sidebar a.active, .sidebar a:hover {
            box-sizing: border-box; display: flex; align-items: center; justify-content: center;
            flex: 0 0 42px !important; width: 42px !important; height: 42px !important;
            min-width: 42px !important; min-height: 42px !important; max-width: 42px;
            margin: 0 !important; padding: 0 !important; border-radius: 13px; font-size: 24px;
        }
        .sidebar .logo { margin-right: auto !important; font-size: 28px; }
        .main-content {
            box-sizing: border-box; order: 1; flex: 0 0 auto;
            width: 100%; min-width: 0; height: auto; min-height: 0; max-height: none;
            padding: 25px 18px; overflow: visible;
        }
    }
</style>
<nav class="sidebar" aria-label="주 메뉴" style="overflow: auto;">
    <div class="logo" aria-label="Health Overview">HO</div>
    <a href="{% url 'home' %}" title="홈" aria-label="홈" {% if request.resolver_match.url_name == 'home' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#home"></use></svg></a>
    <a href="{% url 'exercise_calendar' %}" title="달력보기" aria-label="달력보기" {% if request.resolver_match.url_name == 'exercise_calendar' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#calendar"></use></svg></a>
    <a href="{% url 'goal_progress' %}" title="목표 실천" aria-label="목표 실천" {% if request.resolver_match.url_name == 'goal_progress' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#target"></use></svg></a>
    <a href="{% url 'today_record' %}" title="운동 기록" aria-label="운동 기록" {% if request.resolver_match.url_name == 'today_record' or request.resolver_match.url_name == 'exercise_edit' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#exercise"></use></svg></a>
    <a href="{% url 'meal_record' %}" title="식사 기록" aria-label="식사 기록" {% if request.resolver_match.url_name == 'meal_record' or request.resolver_match.url_name == 'meal_edit' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#meal"></use></svg></a>
    <a href="{% url 'meal_plan' %}" title="맞춤 식단" aria-label="맞춤 식단" {% if request.resolver_match.url_name == 'meal_plan' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#nutrition"></use></svg></a>
    <a href="{% url 'profile_update' %}" title="프로필 설정" aria-label="프로필 설정" {% if request.resolver_match.url_name == 'profile_update' or request.resolver_match.url_name == 'profile_setup' or request.resolver_match.url_name == 'password_change' or request.resolver_match.url_name == 'password_change_done' %}class="active" aria-current="page"{% endif %}><svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><use href="{% static 'main/stitch_icons.svg' %}#settings"></use></svg></a>
</nav>
