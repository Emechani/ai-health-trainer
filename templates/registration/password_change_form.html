<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
</head>
<body>
    {% include 'includes/standalone_navigation.html' %}
    <h2>비밀번호 변경</h2>
    <p>새로운 비밀번호를 입력해 주세요.</p>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit">비밀번호 변경</button>
            <!-- 변경을 취소하고 메인 화면으로 돌아가는 버튼 -->
            <a href="{% url 'home' %}">
                <button type="button">취소하고 홈으로</button>
            </a>
        </div>
    </form>
</body>
</html>
