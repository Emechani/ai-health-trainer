{% extends 'registration/auth_base.html' %}
{% block title %}비밀번호 변경 · Health Overview{% endblock %}
{% block content %}
<h1 id="auth-title">비밀번호 변경</h1>
<p class="subtitle">현재 비밀번호를 확인하고 새로운 비밀번호를 설정해 주세요.</p>
<form method="post">
    {% csrf_token %}
    {% include 'registration/auth_fields.html' %}
    <button class="primary" type="submit">새 비밀번호로 변경</button>
</form>
<div class="account-links"><a href="{% url 'profile_update' %}">프로필 설정으로 돌아가기</a><a href="{% url 'home' %}">취소하고 홈으로</a></div>
{% endblock %}
